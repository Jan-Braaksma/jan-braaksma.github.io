<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            /* background-color: #f0f0f0; */
            background-color: black;
        }

        .header {
            background-color: #001f3f;
            color: #fff;
            padding: 20px;
            text-align: left;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 300px 300px 300px;
            grid-template-rows: auto auto;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .item {
            text-align: center;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }


        .item img {
            border-radius: 4px;
            max-height: 300px;
            max-width: 300px;
        }

        /* .item a {
            display: block;
            margin-top: 10px;
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
        } */

        #photo,
        #github,
        #email,
        #linkedin {
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 300px;
            max-height: 300px;
        }

        #about {
            grid-column: 1 / 3;
        }

        #photo {
            grid-column: 3;
            aspect-ratio: 1/1;
        }

        #github {
            grid-column: 4;
            aspect-ratio: 1/1;
        }

        #email {
            grid-column: 1;
            grid-row: 2;
            aspect-ratio: 1/1;
        }

        #experience {
            grid-column: 2 / 4;
            grid-row: 2;
        }

        #linkedin {
            grid-column: 4;
            grid-row: 2;
            aspect-ratio: 1/1;
        }
    </style>
    <script>
        // Todo
    </script>
    <title>Jan Braaksma</title>
</head>
